<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Core CPU Scheduling Simulator</title>
    <meta
      name="description"
      content="Multi-Core CPU Scheduling Simulator with Real-Time Hardware Monitoring, Performance Analytics, and complete Windows C11/MinGW source project."
    />
    <meta name="theme-color" content="#0d1317" />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Multi-Core CPU Scheduling Simulator" />
    <meta
      property="og:description"
      content="Multi-Core CPU Scheduling Simulator with Real-Time Hardware Monitoring, Performance Analytics, and complete Windows C11/MinGW source project."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://multi-core-cpu-scheduling-simulator.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Multi-Core CPU Scheduling Simulator" />
    <meta
      name="twitter:description"
      content="Interactive multi-core FCFS, SJF, SRTF, Priority, and Round Robin simulator with real-time Gantt replay and performance analytics."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="canonical" href="https://multi-core-cpu-scheduling-simulator.vercel.app/" />
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem('cpu-simulator-theme');
        } catch {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f4f6f5' : '#0d1317';
      })();
    </script>
  </head>
  <body>
    <noscript>
      <div style="padding:24px;color:#eaf0f2;background:#0d1317;font-family:sans-serif;text-align:center;">
        Multi-Core CPU Scheduling Simulator requires JavaScript to run.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
